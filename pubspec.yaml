name: kazakh_book_shop
description: "Қазақ классикалық әдебиетінің мобильді кітап дүкені (Flutter Capstone Project)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.2.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.5
  sqflite_common_ffi: ^2.3.4 # тестте SQLite-ты компьютерде іске қосу үшін

flutter:
  uses-material-design: true
  assets:    
    - assets/123.jpeg
    - assets/my_book.jpeg
    - assets/my_book1.jpeg
    - assets/my_book2.jpeg
    - assets/my_book3.jpeg
    - assets/my_book4.jpeg
    - assets/my_book5.jpeg

